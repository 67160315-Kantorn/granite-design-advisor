services:
  # ===== ฐานข้อมูล MySQL =====
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-granite_db}
      MYSQL_USER: ${MYSQL_USER:-granite_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-granite_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===== หน้าเว็บจัดการฐานข้อมูล (ดู/แก้ตารางผ่านเบราว์เซอร์) =====
  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy

  # ===== Backend (FastAPI) =====
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-granite_db}
      DB_USER: ${MYSQL_USER:-granite_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-granite_pass}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
